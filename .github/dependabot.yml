# Weekly update PRs into development, with conventional commit messages for release-please.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # one PR for all development tools (eslint, typescript, commitlint, ...)
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript only up to a given version; take majors by hand
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types must match the oldest Node version in package.json engines
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
