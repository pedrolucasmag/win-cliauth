on:
  push:
    branches:
      - main
  # Manual run: publishes the current main to npm (e.g. to retry a failed publish)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          node-version: 22
      # Publishes via npm trusted publishing (OIDC), no token needed; requires npm >= 11.5.1
      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          npm install -g npm@latest
          npm install --force
          npm run build
          npm publish

  # After a release, opens a PR bringing the release commit (version bump, CHANGELOG) back into development.
  sync-development:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          open=$(gh pr list --repo "$REPO" --base development --head main --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh pr create --repo "$REPO" --base development --head main \
              --title "chore: sync main into development" \
              --body "Brings the release commit (version bump and CHANGELOG) back into development. Merge it with **Create a merge commit**." \
              || echo "Nothing to sync: development already contains main."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
