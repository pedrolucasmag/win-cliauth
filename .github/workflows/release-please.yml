on:
  push:
    branches:
      - main
  # Manual run: publishes the current main to npm (e.g. to retry a failed publish)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          node-version: 22
      # Publishes via npm trusted publishing (OIDC), no token needed; requires npm >= 11.5.1
      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          npm install -g npm@latest
          npm install --force
          npm run build
          npm publish
