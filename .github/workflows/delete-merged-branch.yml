name: delete merged branch

# Deletes a pull request's branch once it is merged; main and development are kept.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'development'
    runs-on: ubuntu-latest
    steps:
      # the branch may already be gone (deleted by hand)
      - run: gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "Branch $BRANCH was already deleted."
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
